services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alterego
      POSTGRES_PASSWORD: alterego
      POSTGRES_DB: alterego
    ports:
      - "5432:5432"
    volumes:
      - alterego-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alterego"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  alterego-db:
