name: CI
on:
  pull_request:
  push:
    branches: [main, master, overhaul]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alterego
          POSTGRES_PASSWORD: alterego
          POSTGRES_DB: alterego
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alterego" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: '1'
      DATABASE_URL: postgresql://alterego:alterego@localhost:5432/alterego
      NEXTAUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      PROTOTYPE_DATA: 'true'
      LIVE_CALLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma client
        run: if [ -f prisma/schema.prisma ]; then npx prisma generate; fi
      - name: Playwright browsers
        run: if grep -q '"@playwright/test"' package.json; then npx playwright install --with-deps chromium; fi
      - run: node harness/verify.mjs --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: |
            docs/evidence/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
